<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso administrador | JD Time</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c1916">
  <link rel="icon" href="../assets/iconos/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="login">
  <header class="cabecera">
    <div class="envoltura cabecera__interior">
      <a class="marca" href="../index.html">
        <img src="/frontend/img/logo.jpg" alt="" width="40" height="40" style="border-radius: 8px;">
        <span class="marca__texto"><strong>JD Time</strong><small>Administración</small></span>
      </a>
      <a href="../index.html">Volver a la tienda</a>
    </div>
  </header>
  <main class="acceso" id="contenido">
    <form class="acceso__tarjeta" id="form-ingreso">
      <p class="sobrelinea">Panel</p>
      <h1>Ingresar</h1>
      <p>Solo el administrador autorizado puede gestionar los productos.</p>
      <label>Correo
        <input name="email" type="email" autocomplete="username" required maxlength="160">
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required maxlength="72">
      </label>
      <button class="boton" type="submit">Ingresar</button>
      <p id="mensaje-ingreso" role="alert"></p>
    </form>
  </main>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
