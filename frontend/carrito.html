<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="assets/iconos/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="carrito">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
 
  <header class="cabecera">

      <a class="marca" href="index.html">
        <img src="/frontend/img/logo.jpg" alt="" width="40" height="40" style="border-radius: 8px;">
        <span class="marca__texto">
          <strong>JD Time</strong>
          <small>Relojes y lociones</small>
        </span>
      </a>
      <button class="menu" type="button" aria-expanded="false" aria-controls="navegacion">Menú</button>
      <nav id="navegacion" class="nav" aria-label="Principal">
        <a href="index.html" data-nav="inicio">Inicio</a>
        <a href="catalogo.html" data-nav="catalogo">Catálogo</a>
        <a href="catalogo.html?categoria=relojes" data-nav="relojes">Relojes</a>

          <span class="sr" data-contador-texto>0 productos en el carrito</span>

      </nav>
    </div>
  </header>
  <main id="contenido">
    <div class="envoltura">
      <section class="seccion">
        <p class="sobrelinea">Pedido</p>

  <footer class="pie">

      <div>
        <p class="marca-pie">JD Time</p>
        <p>Relojes y lociones, con pedidos directos por WhatsApp.</p>

      <nav aria-label="Pie de página">

        <a href="catalogo.html?categoria=lociones">Lociones</a>

      </nav>
      <div>
        <p><a href="https://wa.me/573105268939">Escribir por WhatsApp</a></p>
        <p><a href="admin/login.html">Administración</a></p>
      </div>
    </div>

  <div class="aviso" data-aviso hidden role="status"></div>
  <script type="module" src="js/app.js"></script>
